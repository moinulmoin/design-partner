name: Validate skill
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package
        run: python3 scripts/validate.py
      - name: Check whitespace
        run: git show --format= --check HEAD
